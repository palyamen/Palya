name: Build NET SPEED by Astra

on:
  workflow_dispatch:
  push:
    paths:
      - "NET-SPEED/**"
      - ".github/workflows/build-net-speed.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: NET-SPEED
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NET-SPEED-by-Astra-debug
          path: NET-SPEED/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
