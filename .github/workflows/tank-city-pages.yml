name: Deploy TANKS by Astra to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tank-city/**"
      - ".github/workflows/tank-city-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./tank-city
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
