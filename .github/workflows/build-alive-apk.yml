name: Build ALIVE 0.1 Android APK
on:
  push:
    branches: [main]
    paths:
      - "alive-app/**"
      - ".github/workflows/build-alive-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          build-root-directory: alive-app
          arguments: assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ALIVE-0.1-Android-APK
          path: alive-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
