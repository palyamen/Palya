<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101910"><title>ALIVE 0.3 · Живой мир</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101910;color:#edf3df;font-family:system-ui,Arial}
#app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:9px;padding:9px}
#world{width:100%;height:100%;display:block;background:#294b30;border:1px solid #657c55;border-radius:13px;touch-action:none}
aside{display:flex;flex-direction:column;gap:7px;min-width:0;overflow:hidden}
.card{background:linear-gradient(145deg,#203326,#17251c);border:1px solid #435c43;border-radius:11px;padding:9px;min-width:0;box-shadow:0 3px 12px #0003}
.title{font-weight:900;letter-spacing:1px;color:#c5e58a;font-size:13px}.muted{color:#a8b9a0;font-size:10px}.stat{font-size:12px;line-height:1.45}
#goal{font-size:13px;font-weight:800;color:#f3d58a;margin-top:5px}
#people{font-size:11px;line-height:1.4;max-height:170px;overflow:auto}.person{padding:5px 2px;border-bottom:1px solid #344638;cursor:pointer}.person:active{background:#314b37}
#resources{font-size:12px;line-height:1.65}.log{font-size:11px;line-height:1.4;overflow:auto;flex:1;min-height:75px}.log div{border-bottom:1px solid #344638;padding:4px 0}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px}button{background:linear-gradient(#c8e58b,#9dbf62);color:#1a2818;border:0;border-radius:8px;padding:9px 5px;font-weight:800;font-size:11px;box-shadow:0 2px 0 #526c3c}button.secondary{background:#344b38;color:#e4efdb;border:1px solid #60765b;box-shadow:none}
.actionbuttons{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#inspect{font-size:10px;color:#e9d8a4;line-height:1.35;margin-top:4px;min-height:25px}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:5px;gap:5px}aside{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto minmax(58px,1fr) auto;gap:5px;overflow:hidden}.topcard{grid-column:1/3;grid-row:1}.peoplecard{grid-column:1;grid-row:2/4}.resourcecard{grid-column:2;grid-row:2}.inspectcard{grid-column:2;grid-row:3}.logcard{grid-column:1/3;grid-row:4}.actionbuttons{grid-column:1/3;grid-row:5}.buttons{grid-column:1/3;grid-row:6}.card{padding:6px}.log{max-height:66px}.stat{font-size:10px}.title{font-size:11px}#people{max-height:105px;font-size:10px}#goal{font-size:11px;margin-top:2px}button{padding:8px 3px;font-size:10px}}
</style></head><body><div id="app">
<canvas id="world" aria-label="Карта живого мира"></canvas>
<aside>
<section class="card topcard"><div class="title">🌿 ALIVE 0.3 · ЖИВОЙ МИР</div><div class="muted">2D SURVIVAL · OFFLINE · АВТОНОМНАЯ ЦИВИЛИЗАЦИЯ</div><div id="day" class="stat">День 1</div><div id="goal">Мир просыпается…</div></section>
<section class="card peoplecard"><div class="title">👥 ЖИТЕЛИ</div><div id="people"></div></section>
<section class="card resourcecard"><div class="title">🏕 ПОСЕЛЕНИЕ</div><div id="resources"></div><div class="muted" id="law">Порядок: совет старейшин</div></section>
<section class="card inspectcard"><div class="title">🔎 НАБЛЮДЕНИЕ</div><div id="inspect">Нажми на жителя или его имя, чтобы увидеть подробности.</div></section>
<section class="card logcard"><div class="title">📜 ЛЕТОПИСЬ МИРА</div><div id="log" class="log"></div></section>
<div class="actionbuttons"><button id="build">🏠 Построить дом</button><button id="farm">🌱 Разбить огород</button><button id="craft">🛠 Инструменты</button><button id="lawBtn" class="secondary">⚖ Сменить закон</button></div>
<div class="buttons"><button id="pause">Пауза</button><button id="speed" class="secondary">Скорость ×1</button><button id="save" class="secondary">Сохранить</button><button id="load" class="secondary">Загрузить</button><button id="reset" class="secondary">Новый мир</button></div>
</aside></div><script src="game.js"></script></body></html>
