name: Build Astra Cloud APK

on:
  push:
    branches: [main, astra-cloud]
    paths:
      - "astra-cloud/**"
      - ".github/workflows/build-astra-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          build-root-directory: astra-cloud
          arguments: assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Cloud-debug
          path: astra-cloud/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
